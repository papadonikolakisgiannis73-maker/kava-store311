<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store311</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#eef4ff,#dfeaff);
min-height:100vh;
padding:18px;
color:#111;
}

.wrap{
max-width:520px;
margin:auto;
}

.card{
background:rgba(255,255,255,.72);
backdrop-filter:blur(18px);
border-radius:24px;
padding:24px;
box-shadow:0 12px 35px rgba(0,0,0,.12);
}

h1{
text-align:center;
font-size:34px;
margin-bottom:6px;
}

.sub{
text-align:center;
opacity:.65;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

button{
border:none;
padding:18px;
border-radius:16px;
font-size:18px;
font-weight:bold;
background:#fff;
box-shadow:0 6px 15px rgba(0,0,0,.06);
}

.admin{
background:#0a84ff;
color:#fff;
}

.loading{
text-align:center;
padding:40px;
font-size:20px;
}
</style>
</head>

<body>

<div class="wrap">
<div class="card">

<h1>🦒 Store311</h1>
<div class="sub">Kava Management System</div>

<div id="app" class="loading">
Loading...
</div>

</div>
</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbzb1K18zxhenlDuGAGvqAj_afoDmYU1nUGElzDbHMzTxEnQ289-BCsM2kDjLpP49ivspg/exec";

loadEmployees();

function loadEmployees(){

fetch(API + "?action=employees")
.then(r=>r.json())
.then(data=>{

let h='<div class="grid">';

data.forEach(x=>{
h+='<button onclick="alert(`Employee: '+x.name+'`)">'+x.name+'</button>';
});

h+='<button class="admin" onclick="alert(`Admin mode next`)">ADMIN</button>';

h+='</div>';

document.getElementById("app").innerHTML=h;

})
.catch(err=>{
document.getElementById("app").innerHTML="Connection Error";
});

}

</script>

</body>
</html>
