<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store311</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#eef4ff,#dfeaff);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:#111;
}

.wrap{
width:95%;
max-width:480px;
}

.card{
background:rgba(255,255,255,.65);
backdrop-filter:blur(16px);
border-radius:24px;
padding:28px;
box-shadow:0 10px 35px rgba(0,0,0,.12);
text-align:center;
}

.logo{
font-size:44px;
margin-bottom:10px;
}

h1{
font-size:34px;
margin-bottom:8px;
}

p{
opacity:.7;
margin-bottom:24px;
}

button{
width:100%;
border:none;
padding:18px;
border-radius:16px;
font-size:18px;
font-weight:bold;
background:#0a84ff;
color:#fff;
margin-top:10px;
}

.small{
background:#fff;
color:#111;
border:1px solid #ddd;
}
</style>
</head>

<body>

<div class="wrap">
<div class="card">

<div class="logo">🦒</div>

<h1>Store311</h1>

<p>Kava Management System</p>

<button onclick="alert('Employee Mode coming next step')">
Employee Mode
</button>

<button class="small" onclick="alert('Admin Mode coming next step')">
Admin Mode
</button>

</div>
</div>

</body>
</html>
